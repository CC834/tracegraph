name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: tracegraph
          POSTGRES_PASSWORD: tracegraph
          POSTGRES_DB: tracegraph_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tracegraph -d tracegraph_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TRACEGRAPH_TEST_POSTGRES_URL: postgresql+psycopg://tracegraph:tracegraph@127.0.0.1:5432/tracegraph_test
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e './backend[dev]'
      - run: ruff check backend
      - run: mypy backend/src
      - run: pytest backend --cov=tracegraph --cov-report=term-missing

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm run lint
      - working-directory: frontend
        run: npm test
      - working-directory: frontend
        run: npm run build
      - working-directory: frontend
        run: npx playwright install --with-deps chromium
      - working-directory: frontend
        run: npm run test:e2e

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag tracegraph:ci .

